name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "requirements*.txt"
      - name: Install Linux Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1 libopengl0 libxkbcommon0 libdbus-1-3
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Verify Qt imports and offscreen rendering
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          import textwrap

          reports = Path('reports')
          reports.mkdir(exist_ok=True)
          probe = textwrap.dedent('''
              import PySide6
              from PySide6 import QtCore, QtGui, QtWidgets
              app = QtWidgets.QApplication(['imageboost-qt-readiness'])
              widget = QtWidgets.QWidget()
              widget.resize(160, 100)
              widget.show()
              app.processEvents()
              assert widget.grab().save('reports/linux-qt-readiness.png'), 'Qt render failed'
              print(f'Qt {QtCore.qVersion()} / PySide6 {PySide6.__version__} / {app.platformName()}')
              widget.close()
              app.quit()
          ''')
          result = subprocess.run([sys.executable, '-c', probe], capture_output=True, text=True)
          details = (result.stdout + result.stderr).strip()
          (reports / 'linux-qt-readiness.log').write_text(details + '\n', encoding='utf-8')
          print(details)
          if result.returncode:
              message = details or f'Qt readiness process exited with code {result.returncode}'
              message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Qt runtime is unavailable::{message}')
              sys.exit(1)
          PY
      - name: Lint
        run: python -m ruff check .
      - name: Test algorithms, I/O, and interface
        run: python -m pytest -q --junitxml=reports/linux-tests.xml
      - name: Run complete source application smoke test
        run: python main.py --smoke-test --smoke-output reports/linux-source-smoke.json
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ImageBoostPro-Linux-checks
          path: reports/
          if-no-files-found: ignore
          retention-days: 30
