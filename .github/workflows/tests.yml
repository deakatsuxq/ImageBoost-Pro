name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "requirements*.txt"
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Lint
        run: python -m ruff check .
      - name: Test algorithms, I/O, and interface
        run: python -m pytest -q --junitxml=reports/linux-tests.xml
      - name: Run complete source application smoke test
        run: python main.py --smoke-test --smoke-output reports/linux-source-smoke.json
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ImageBoostPro-Linux-checks
          path: reports/
          if-no-files-found: ignore
          retention-days: 30
