name: Windows build

on:
  workflow_dispatch:
    inputs:
      with_ai:
        description: "Include optional AI dependencies (large build; weights downloaded separately)"
        required: false
        default: false
        type: boolean
  push:
    branches: [main, "codex/**", "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows 10/11 x64 portable
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64
          cache: pip
          cache-dependency-path: "requirements*.txt"
      - name: Install, test, build, and verify the extracted ZIP
        shell: pwsh
        env:
          INCLUDE_AI: ${{ inputs.with_ai && '1' || '0' }}
        run: |
          $withAI = $env:INCLUDE_AI -eq '1'
          ./scripts/build_windows.ps1 -WithAI:$withAI
      - name: Upload Windows distribution
        uses: actions/upload-artifact@v4
        with:
          name: ImageBoostPro-Windows
          path: |
            dist/ImageBoostPro-Windows.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ImageBoostPro-Windows-checks
          path: |
            reports/
            build/ImageBoostPro/warn-ImageBoostPro.txt
          if-no-files-found: ignore
          retention-days: 30
